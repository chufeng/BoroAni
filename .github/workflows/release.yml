name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "创建 Release 使用的标签，留空则只构建不发布"
        required: false
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use official Gradle distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'buildSrc/**', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > gradle/assemble/dandanplay.jks
            echo "type=release" >> "${GITHUB_OUTPUT}"
            echo "task=assembleRelease" >> "${GITHUB_OUTPUT}"
          else
            keytool -genkeypair -keystore gradle/assemble/debug.jks -storetype JKS \
              -storepass 123456 -keypass 123456 -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BoroAni CI, O=BoroAni, C=CN"
            echo "type=debug" >> "${GITHUB_OUTPUT}"
            echo "task=assembleDebug" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: ./gradlew ${{ steps.signing.outputs.task }} --stacktrace

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE 'versionName = "[^"]+"' buildSrc/src/main/java/Versions.kt | cut -d'"' -f2)
          suffix=""
          if [ "${{ steps.signing.outputs.type }}" = "debug" ]; then
            suffix="-debug"
          fi
          mkdir -p dist
          count=0
          while IFS= read -r apk; do
            case "${apk}" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *universal*) abi="universal" ;;
              *) abi="apk" ;;
            esac
            cp "${apk}" "dist/BoroAni_v${version}_${abi}${suffix}.apk"
            count=$((count + 1))
          done < <(find app/build/outputs/apk -type f -name '*.apk')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          test "${count}" -gt 0
          ls -lh dist

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            tag="${GITHUB_REF_NAME}"
            case "${tag}" in
              *-*) prerelease="true" ;;
              *) prerelease="false" ;;
            esac
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease:-false}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BoroAni-v${{ steps.apks.outputs.version }}-${{ steps.signing.outputs.type }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: BoroAni ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          body: |
            BoroAni v${{ steps.apks.outputs.version }}

            - commit: ${{ github.sha }}
            - build: ${{ steps.signing.outputs.type }}

            ${{ steps.signing.outputs.type == 'release' && '正式签名构建，可直接覆盖安装同签名旧版本。' || '未配置签名 Secrets，本包为 debug 签名测试包，仅供试用，不能覆盖安装正式版本。' }}
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
